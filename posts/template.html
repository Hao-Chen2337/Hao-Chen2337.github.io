<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../avatar.png">
<title>文章标题 · Hao Chen</title>
<style>
  :root {
    --bg: #f7f8fb; --surface: #ffffff; --text: #111827; --muted: #6b7280;
    --faint: #9ca3af; --border: #e7e8ee; --accent: #6366f1; --accent-2: #a855f7; --accent-3: #ec4899;
  }
  :root[data-theme="dark"] {
    --bg: #0a0b10; --surface: #13141b; --text: #eceef4; --muted: #9aa1b2;
    --faint: #636b7c; --border: #23252f; --accent: #818cf8; --accent-2: #c084fc; --accent-3: #f472b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .header { border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); }
  .header .left a { color: var(--muted); font-size: 14px; text-decoration: none; }
  .header .left a:hover { color: var(--accent); }
  .header .brand { font-weight: 700; font-size: 15px; }
  .theme-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  article { padding: 48px 0 32px; }
  h1 { font-size: 30px; letter-spacing: -.4px; line-height: 1.3; margin-bottom: 14px; }
  .meta { color: var(--faint); font-size: 14px; margin-bottom: 28px; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta .tag { color: var(--accent); }
  .body { font-size: 16px; color: var(--text); }
  .body h2 { font-size: 22px; margin: 32px 0 12px; }
  .body h3 { font-size: 18px; margin: 24px 0 10px; }
  .body p { margin-bottom: 16px; }
  .body ul, .body ol { margin: 0 0 16px 22px; }
  .body code {
    background: var(--surface-2, #f1f2f7); padding: 2px 6px; border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px;
  }
  :root[data-theme="dark"] .body code { background: #1f2230; }
  .body pre {
    background: #0f1117; color: #e6e8ee; padding: 16px 18px; border-radius: 10px;
    overflow-x: auto; margin-bottom: 16px; font-size: 14px; line-height: 1.6;
  }
  .body pre code { background: transparent; padding: 0; color: inherit; }
  .body img { max-width: 100%; border-radius: 10px; }
  .body a { color: var(--accent); }

  .post-end { border-top: 1px solid var(--border); margin-top: 32px; padding-top: 20px; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tags-row .tag { font-size: 13px; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); padding: 3px 12px; border-radius: 999px; }
  .prevnext { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }
  .prevnext a { color: var(--muted); text-decoration: none; }
  .prevnext a:hover { color: var(--accent); }
  .prevnext .empty { color: var(--faint); }
  .back { display: block; text-align: center; margin: 24px 0 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="header">
    <div class="left"><a href="../index.html">← 返回首页</a></div>
    <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
  </div>
  <div class="wrap">
    <article>
      <!-- 改这里：标题 -->
      <h1>文章标题</h1>
      <!-- 改这里：日期和标签 -->
      <div class="meta">
        <span>2026-09-05</span>
        <span>约 800 字</span>
        <span class="tag"># 标签</span>
      </div>
      <!-- 改这里：正文 -->
      <div class="body">
        <p>从这里开始写正文……</p>
        <h2>小节标题</h2>
        <p>段落内容。支持 <code>行内代码</code>、<a href="#">链接</a>、列表、代码块：</p>
        <pre><code># 代码块
print("hello")</code></pre>
        <ul>
          <li>列表项 1</li>
          <li>列表项 2</li>
        </ul>
      </div>

      <div class="post-end">
        <!-- 改这里：文末标签 -->
        <div class="tags-row">
          <span class="tag">标签一</span>
          <span class="tag">标签二</span>
        </div>
        <!-- 改这里：上一篇 / 下一篇 链接 -->
        <div class="prevnext">
          <span class="empty">上一篇：没有了</span>
          <a href="#">下一篇：文章标题 →</a>
        </div>
      </div>
    </article>
    <a class="back" href="../index.html">← 返回首页</a>
  </div>

  <script>
    function toggleTheme() {
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') !== 'dark';
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('.theme-btn').textContent = dark ? '☀️' : '🌙';
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    (function () {
      var dark = null;
      try { dark = localStorage.getItem('theme'); } catch (e) {}
      if (dark === 'dark' || (dark === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-btn').textContent = '☀️';
      }
    })();
  </script>
</body>
</html>
