<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Hao Chen 的技术分享博客">
<link rel="icon" type="image/png" href="avatar.png">
<title>Hao Chen · 技术博客</title>
<style>
  :root {
    --bg: #f7f8fb;
    --surface: #ffffff;
    --surface-2: #f1f2f7;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --border: #e7e8ee;
    --accent: #6366f1;
    --accent-2: #a855f7;
    --accent-3: #ec4899;
    --shadow-sm: 0 1px 2px rgba(17, 24, 39, .04);
    --shadow: 0 1px 3px rgba(17, 24, 39, .05), 0 10px 28px rgba(17, 24, 39, .06);
    --shadow-lg: 0 2px 6px rgba(99, 102, 241, .08), 0 18px 44px rgba(99, 102, 241, .14);
  }
  :root[data-theme="dark"] {
    --bg: #0a0b10;
    --surface: #13141b;
    --surface-2: #1a1c25;
    --text: #eceef4;
    --muted: #9aa1b2;
    --faint: #636b7c;
    --border: #23252f;
    --accent: #818cf8;
    --accent-2: #c084fc;
    --accent-3: #f472b6;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .4);
    --shadow-lg: 0 2px 6px rgba(129, 140, 248, .12), 0 18px 44px rgba(129, 140, 248, .2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* 背景 */
  .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .bg .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .bg .b1 { width: 460px; height: 460px; background: var(--accent); top: -160px; left: -120px; opacity: .16; }
  .bg .b2 { width: 400px; height: 400px; background: var(--accent-2); top: 34%; right: -140px; opacity: .13; }

  /* 顶栏 */
  .header {
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10;
  }
  .header-inner { max-width: 1080px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .name { font-weight: 700; font-size: 17px; }
  .brand .sub { color: var(--faint); font-size: 13px; }
  .nav { display: flex; align-items: center; gap: 20px; }
  .nav a { color: var(--muted); font-size: 14px; transition: color .15s; }
  .nav a:hover { color: var(--text); }
  .nav a.active { color: var(--text); font-weight: 600; }
  .theme-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }

  /* 顶部横幅 */
  .hero { max-width: 1080px; margin: 0 auto; padding: 36px 24px 0; }
  .hero-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 30px 32px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .hero-card::after {
    content: ""; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 50%;
    filter: blur(70px); opacity: .22; pointer-events: none;
  }
  .hero-card h1 { font-size: 26px; letter-spacing: -.3px; }
  .hero-card .hero-sub { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .stats { display: flex; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
  .stats .st { display: flex; flex-direction: column; }
  .stats .st b { font-size: 22px; letter-spacing: -.5px; }
  .stats .st span { font-size: 12.5px; color: var(--faint); }

  /* 主体两栏 */
  .layout { max-width: 1080px; margin: 0 auto; padding: 30px 24px 0; display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: start; }

  .main { min-width: 0; }
  .main-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .main-head h2 { font-size: 19px; }
  .main-head .count { color: var(--faint); font-size: 13px; }

  .post { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow); display: block; transition: transform .16s ease, border-color .2s, box-shadow .2s; }
  .post:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
  .post .meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--faint); margin-bottom: 6px; }
  .post h3 { font-size: 18px; margin-bottom: 6px; }
  .post h3:hover { color: var(--accent); }
  .post .summary { color: var(--muted); font-size: 14.5px; margin-bottom: 12px; }
  .post .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .post .tag { font-size: 12px; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); padding: 2px 10px; border-radius: 6px; }

  .empty { text-align: center; color: var(--faint); padding: 56px 20px; border: 1px dashed var(--border); border-radius: 14px; }
  .empty .big { font-size: 32px; margin-bottom: 10px; }

  /* 侧栏 */
  .sidebar { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 78px; }
  .widget { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .widget h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 14px; }

  /* 搜索 */
  .search input { width: 100%; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search .hint { font-size: 12px; color: var(--faint); margin-top: 8px; }

  /* 关于我 */
  .about-w .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .about-w .avatar { width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0; object-fit: cover; box-shadow: 0 2px 6px rgba(99, 102, 241, .25); }
  .about-w .who { font-weight: 600; }
  .about-w .who-sub { font-size: 12px; color: var(--faint); }
  .about-w p { color: var(--muted); font-size: 13.5px; }
  .about-w .links { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .about-w .links a { font-size: 13px; color: var(--accent); }

  /* 最近文章 */
  .recent-w a { display: block; padding: 8px 0; font-size: 14px; color: var(--muted); border-bottom: 1px dashed var(--border); }
  .recent-w a:last-child { border-bottom: none; }
  .recent-w a:hover { color: var(--accent); }
  .recent-w a .d { font-size: 12px; color: var(--faint); display: block; }
  .recent-w .none { color: var(--faint); font-size: 13px; }

  /* 标签云 */
  .tags-w .tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tags-w .tag { font-size: 12.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; background: var(--surface-2); cursor: pointer; }
  .tags-w .tag:hover { color: var(--accent); border-color: var(--accent); }
  .tags-w .tag i { font-style: normal; color: var(--faint); margin-left: 4px; font-size: 11px; }
  .tags-w .none { color: var(--faint); font-size: 13px; }

  /* 归档 */
  .archive-w ul { list-style: none; }
  .archive-w li { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 0; border-bottom: 1px dashed var(--border); color: var(--muted); }
  .archive-w li:last-child { border-bottom: none; }
  .archive-w .y { font-weight: 600; color: var(--text); }
  .archive-w .n { color: var(--faint); }
  .archive-w .none { color: var(--faint); font-size: 13px; }

  /* 友链 */
  .link-w a { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); padding: 5px 0; }
  .link-w a:hover { color: var(--accent); }
  .link-w .none { color: var(--faint); font-size: 13px; }

  footer { text-align: center; color: var(--faint); font-size: 13px; padding: 40px 24px 52px; }
  footer .f-links { margin-bottom: 12px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }

  /* 返回顶部 */
  .top-btn {
    position: fixed; right: 22px; bottom: 22px; width: 42px; height: 42px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted); cursor: pointer;
    box-shadow: var(--shadow); font-size: 18px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .top-btn.show { opacity: 1; pointer-events: auto; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .stats { gap: 20px; }
  }
</style>
</head>
<body>

  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

  <!-- ═════ 顶部导航 ═════ -->
  <header class="header">
    <div class="header-inner">
      <div class="brand"><span class="name">Hao Chen</span><span class="sub">技术分享博客</span></div>
      <div class="nav">
        <a href="index.html" class="active">首页</a>
        <a href="#archive">归档</a>
        <a href="#about">关于</a>
        <button class="theme-btn" id="themeBtn" title="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <!-- ═════ 顶部横幅 + 数据看板 ═════ -->
  <section class="hero">
    <div class="hero-card">
      <h1>欢迎来到我的博客 👋</h1>
      <p class="hero-sub">记录技术、学习与折腾 —— 大模型、RISC-V、数学，还有一些效率小工具。</p>
      <div class="stats">
        <div class="st"><b id="stPosts">0</b><span>文章</span></div>
        <div class="st"><b id="stTags">0</b><span>标签</span></div>
        <div class="st"><b id="stYears">0</b><span>年份</span></div>
        <div class="st"><b id="stWords">0</b><span>累计字数</span></div>
      </div>
    </div>
  </section>

  <div class="layout">

    <!-- ═════ 主内容区 ═════ -->
    <main class="main">
      <div class="main-head">
        <h2>全部文章</h2>
        <span class="count" id="postCount"></span>
      </div>
      <div id="postList"></div>
    </main>

    <!-- ═════ 右侧栏 ═════ -->
    <aside class="sidebar">

      <div class="widget search">
        <h3>搜索</h3>
        <input type="text" id="searchInput" placeholder="搜索文章标题 / 标签…">
        <div class="hint">支持标题、标签、摘要关键词</div>
      </div>

      <div class="widget about-w" id="about">
        <h3>关于我</h3>
        <div class="head">
          <img class="avatar" src="avatar.png" alt="头像">
          <div><div class="who">Hao Chen</div><div class="who-sub">开发者 · 技术爱好者</div></div>
        </div>
        <div class="links">
          <a href="https://github.com/Hao-Chen2337" target="_blank" rel="noopener">GitHub</a>
          <a href="mailto:2113996104@qq.com">邮箱</a>
        </div>
      </div>

      <div class="widget recent-w">
        <h3>最近文章</h3>
        <div id="recentList"></div>
      </div>

      <div class="widget tags-w">
        <h3>标签</h3>
        <div class="tagcloud" id="tagCloud"></div>
      </div>

      <div class="widget archive-w" id="archive">
        <h3>归档</h3>
        <ul id="archiveList"></ul>
      </div>

      <div class="widget link-w">
        <h3>友链</h3>
        <div class="none">暂无友链，欢迎交换</div>
      </div>

    </aside>
  </div>

  <footer>
    <div class="f-links">
      <a href="index.html">首页</a>
      <a href="https://github.com/Hao-Chen2337" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:2113996104@qq.com">邮箱</a>
      <a href="#">RSS</a>
    </div>
    <div>© 2026 Hao Chen · 由 GitHub Pages 驱动</div>
  </footer>

  <button class="top-btn" id="topBtn" title="返回顶部">↑</button>

  <script src="posts.js"></script>
  <script>
    // POSTS 由 posts.js 提供（const POSTS = [...]）。若缺失则兜底为空数组。
    if (typeof POSTS === 'undefined') { window.POSTS = []; }

    function esc(s) { return String(s == null ? '' : s); }

    function allTags() {
      var t = {};
      POSTS.forEach(function (p) { (p.tags || []).forEach(function (x) { t[x] = (t[x] || 0) + 1; }); });
      return t;
    }

    function renderList(query) {
      var list = document.getElementById('postList');
      var count = document.getElementById('postCount');
      var q = (query || '').trim().toLowerCase();
      var filtered = POSTS.filter(function (p) {
        if (!q) return true;
        var hay = (esc(p.title) + ' ' + esc(p.summary) + ' ' + (p.tags || []).join(' ')).toLowerCase();
        return hay.indexOf(q) !== -1;
      });

      if (filtered.length === 0) {
        list.innerHTML = POSTS.length === 0
          ? '<div class="empty"><div class="big">📝</div>还没有文章，敬请期待</div>'
          : '<div class="empty"><div class="big">🔍</div>没有找到相关文章</div>';
        count.textContent = '';
        return;
      }
      count.textContent = '共 ' + filtered.length + ' 篇';
      list.innerHTML = filtered.map(function (p) {
        var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
        return '<a class="post" href="' + esc(p.url) + '">'
          + '<div class="meta"><span>' + esc(p.date) + '</span></div>'
          + '<h3>' + esc(p.title) + '</h3>'
          + '<div class="summary">' + esc(p.summary) + '</div>'
          + '<div class="tags">' + tags + '</div>'
          + '</a>';
      }).join('');
    }

    function renderRecent() {
      var el = document.getElementById('recentList');
      if (POSTS.length === 0) { el.innerHTML = '<div class="none">暂无文章</div>'; return; }
      var recent = POSTS.slice().sort(function (a, b) { return (b.date || '') < (a.date || '') ? -1 : 1; }).slice(0, 5);
      el.innerHTML = recent.map(function (p) {
        return '<a href="' + esc(p.url) + '"><span class="d">' + esc(p.date) + '</span>' + esc(p.title) + '</a>';
      }).join('');
    }

    function renderTags() {
      var el = document.getElementById('tagCloud');
      var tags = allTags();
      var keys = Object.keys(tags);
      if (keys.length === 0) {
        el.innerHTML = '<div class="none">暂无标签</div>';
        return;
      }
      keys.sort(function (a, b) { return tags[b] - tags[a]; });
      el.innerHTML = keys.map(function (t) {
        return '<span class="tag" data-tag="' + esc(t) + '">' + esc(t) + '<i>' + tags[t] + '</i></span>';
      }).join('');
    }

    function renderArchive() {
      var el = document.getElementById('archiveList');
      if (POSTS.length === 0) { el.innerHTML = '<div class="none">暂无文章</div>'; return; }
      var byYear = {};
      POSTS.forEach(function (p) { var y = (esc(p.date).slice(0, 4)) || '其他'; byYear[y] = (byYear[y] || 0) + 1; });
      el.innerHTML = Object.keys(byYear).sort().reverse().map(function (y) {
        return '<li><span class="y">' + y + '</span><span class="n">' + byYear[y] + ' 篇</span></li>';
      }).join('');
    }

    function renderStats() {
      var tags = allTags();
      var years = {};
      var words = 0;
      POSTS.forEach(function (p) { years[esc(p.date).slice(0, 4) || '其他'] = 1; words += esc(p.summary).length; });
      document.getElementById('stPosts').textContent = POSTS.length;
      document.getElementById('stTags').textContent = Object.keys(tags).length;
      document.getElementById('stYears').textContent = Object.keys(years).length;
      document.getElementById('stWords').textContent = words;
    }

    // 初始化
    renderList('');
    renderRecent();
    renderTags();
    renderArchive();
    renderStats();

    // 搜索
    document.getElementById('searchInput').addEventListener('input', function (e) { renderList(e.target.value); });

    // 点击标签 = 搜索该标签
    document.getElementById('tagCloud').addEventListener('click', function (e) {
      var t = e.target.closest('.tag');
      if (t && t.getAttribute('data-tag')) {
        var v = t.getAttribute('data-tag');
        document.getElementById('searchInput').value = v;
        renderList(v);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // 返回顶部
    var topBtn = document.getElementById('topBtn');
    window.addEventListener('scroll', function () { topBtn.classList.toggle('show', window.scrollY > 400); });
    topBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

    // 主题切换
    (function () {
      var btn = document.getElementById('themeBtn');
      var root = document.documentElement;
      var saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
      function apply(dark) { root.setAttribute('data-theme', dark ? 'dark' : 'light'); btn.textContent = dark ? '☀️' : '🌙'; }
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(dark);
      btn.addEventListener('click', function () { dark = root.getAttribute('data-theme') !== 'dark'; apply(dark); try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} });
    })();
  </script>
</body>
</html>
